<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://js.puter.com/v2/"></script>
</head>
<body>
    <div id="app">
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>AI Chat</h2>
                <button id="newChat">+ Nowy czat</button>
            </div>
            <div class="sidebar-content">
                <div id="chatHistory"></div>
            </div>
            <div class="sidebar-footer">
                <div class="model-info">
                    <span class="model-badge">DARMOWE</span>
                    <span class="model-text">Puter.js - bez kluczy API</span>
                </div>
                <select id="modelSelect">
                    <option value="openai/gpt-5.5">GPT-5.5 (OpenAI)</option>
                    <option value="anthropic/claude-sonnet-4">Claude Sonnet 4</option>
                    <option value="google/gemini-2.0-flash">Gemini 2.0 Flash</option>
                    <option value="openai/gpt-4.1-mini">GPT-4.1 Mini</option>
                    <option value="meta-llama/llama-4-scout">Llama 4 Scout</option>
                </select>
                <p class="api-note">Zero kluczy - logowanie przez Puter</p>
            </div>
        </div>
        <main class="chat-area">
            <div class="chat-header">
                <h1 id="chatTitle">Nowy czat</h1>
            </div>
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <div class="input-wrapper">
                    <textarea id="userInput" placeholder="Napisz wiadomość..." rows="1"></textarea>
                    <button id="sendBtn" title="Wyślij">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
                <p class="disclaimer">AI może podawać nieprawidłowe informacje. Sprawdzaj ważne dane.</p>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
