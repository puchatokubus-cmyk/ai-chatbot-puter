<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrapAi - Trap News & Chat</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://js.puter.com/v2/"></script>
</head>
<body>
    <div id="app">
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="logo-icon">T</span>
                    <h2>TrapAi</h2>
                </div>
                <button id="newChat">+ Nowy czat</button>
            </div>
            <div class="sidebar-content">
                <div id="chatHistory"></div>
            </div>
            <div class="sidebar-footer">
                <div class="model-info">
                    <span class="model-badge">DARMOWE</span>
                    <span class="model-text">GPT, Claude, Gemini</span>
                </div>
                <select id="modelSelect">
                    <option value="openai/gpt-5.5">GPT-5.5</option>
                    <option value="anthropic/claude-sonnet-4">Claude Sonnet 4</option>
                    <option value="google/gemini-2.0-flash">Gemini 2.0 Flash</option>
                    <option value="openai/gpt-4.1-mini">GPT-4.1 Mini</option>
                    <option value="meta-llama/llama-4-scout">Llama 4 Scout</option>
                </select>
                <p class="api-note">Trap newsy, muzyka, kultura</p>
            </div>
        </div>
        <main class="chat-area">
            <div class="chat-header">
                <h1 id="chatTitle">TrapAi</h1>
                <div class="header-actions">
                    <button id="searchToggle" title="Wyszukaj w internecie">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <span>Szukaj w sieci</span>
                    </button>
                </div>
            </div>
            <div class="messages" id="messages"></div>
            <div class="input-area">
                <div class="input-wrapper">
                    <textarea id="userInput" placeholder="Zapytaj o trap, newsy, muzyke..." rows="1"></textarea>
                    <button id="sendBtn" title="Wyslij">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
                <p class="disclaimer">TrapAi - twoj asystent trapowy</p>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
